name: Bug report
description: Something doesn't work as documented
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the problem, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load a workflow with ...
        2. Select node ...
        3. Press Alt+H
        4. ...
    validations:
      required: true
  - type: input
    id: comfyui-version
    attributes:
      label: ComfyUI version
      placeholder: e.g. v0.28.3
    validations:
      required: true
  - type: input
    id: frontend-version
    attributes:
      label: Frontend version
      description: "`comfyui-frontend-package` version — shown in Settings → About."
      placeholder: e.g. 1.45.21
    validations:
      required: true
  - type: input
    id: browser-os
    attributes:
      label: Browser / OS
      placeholder: e.g. Firefox 141 / Windows 11
  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: Open DevTools (F12) → Console, and paste any error, especially lines mentioning LinkSpotlight.
      render: text
  - type: textarea
    id: other-extensions
    attributes:
      label: Other canvas/link extensions installed
      description: Extensions that also touch link rendering (SelectionFocus, LinkRouter, use-everywhere, etc.) — helps diagnose patch conflicts.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem
          required: true
