# Publishes the node to the Comfy Registry (https://registry.comfy.org)
# whenever pyproject.toml changes on main (i.e. on a version bump).
#
# The steps below inline what Comfy-Org/publish-node-action@v1 does, but with
# current action versions (the composite still pins Node 20-based
# actions/checkout@v4 and actions/setup-python@v5, which are deprecated on
# GitHub runners).
#
# Requires the repository secret REGISTRY_ACCESS_TOKEN (registry API key)
# and [tool.comfy].PublisherId set in pyproject.toml.

name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Ding-sl' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install comfy-cli
        run: pip install comfy-cli
      - name: Publish to the registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
