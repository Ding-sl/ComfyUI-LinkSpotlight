# Creates a GitHub Release automatically whenever a v* tag is pushed.
# The release notes are taken from the annotated tag message
# (gh release create --notes-from-tag), so write them when tagging:
#   git tag -a v1.2.3 --cleanup=verbatim -F notes.md && git push origin v1.2.3
# Uses the gh CLI preinstalled on runners — no third-party actions.

name: GitHub Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release from tag
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Ding-sl' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout fetches tags as lightweight (annotated tag
          # objects are peeled), which breaks --notes-from-tag. Re-fetch the
          # real tag object and read its message explicitly instead.
          git fetch origin --force "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ComfyUI-LinkSpotlight $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
